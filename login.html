
<!DOCTYPE html>

<head>
    <title>Programmer Mood Detector - Login</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #4776e6, #8e54e9);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            width: 300px;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4776e6;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h2>💻 Welcome Back!</h2>
    <h3>Programmer Mood Detector</h3>

    <input type="text" id="username"
           placeholder="Enter Username">

    <input type="password" id="password"
           placeholder="Enter Password">

    <button onclick="login()">Login</button>

    <p id="message"></p>
</div>

<script>
function login() {
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if (user === "student" && pass ==="mood123"){
    window.location.href ="/app/";
    } else {
        document.getElementById("message").innerHTML =
            "Invalid Username or Password!";
    }
}
</script>

</body>
</body>
</html>
